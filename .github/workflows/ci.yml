name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: python -m pip install -r requirements-ml.txt
      - run: npm run test:ml
      - run: python -m unittest discover -s rail/tests

  tender-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - run: npm ci
      - run: python -m pip install -r requirements-ai.txt pip-audit==2.9.0
      - run: python -m unittest discover -s tender_ai/tests
      - run: npx tsx --test tests/tenders.test.ts
      - run: python -m tender_ai.evals.run --check-baseline
      - run: pip-audit -r requirements-ai.txt
      - run: docker build -f Dockerfile.tender-ai -t applied-ai-lab/tender-ai:ci .
      - run: terraform fmt -check -recursive infra/azure-tender
      - run: terraform -chdir=infra/azure-tender init -backend=false
      - run: terraform -chdir=infra/azure-tender validate

  rail-lakehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rail.txt
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"
      - run: python -m pip install -r requirements-rail.txt
      - run: python -m unittest discover -s rail/lakehouse/tests
        env:
          RAIL_SPARK_TESTS: "1"
          SPARK_LOCAL_IP: 127.0.0.1
